name: Daily Summary

on:
  schedule:
    # יעד: 20:00 שעון ישראל (קיץ UTC+3 → 17:00 UTC)
    # GitHub מאחר 2-2.5 שעות בשעות עמוסות — מתחילים מ-14:00 UTC (17:00 IST)
    # עם cache, רק הטריגר הראשון שרץ ישלח; השאר מדלגים
    - cron: '0 14 * * 0-4'
    - cron: '20 14 * * 0-4'
    - cron: '40 14 * * 0-4'
    - cron: '0 15 * * 0-4'
    - cron: '20 15 * * 0-4'
    - cron: '40 15 * * 0-4'
    - cron: '0 16 * * 0-4'
    - cron: '20 16 * * 0-4'
    - cron: '40 16 * * 0-4'
    - cron: '0 17 * * 0-4'
    - cron: '20 17 * * 0-4'
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set run date
        id: date
        run: echo "key=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: Check if already sent today
        id: cache
        uses: actions/cache@v4
        with:
          path: .sent-marker
          key: daily-${{ steps.date.outputs.key }}

      - name: Checkout
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Daily Summary
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          MONDAY_API_TOKEN:            ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_BOARD_ID:             ${{ secrets.MONDAY_BOARD_ID }}
          MONDAY_TRANSACTIONS_BOARD_ID: ${{ secrets.MONDAY_TRANSACTIONS_BOARD_ID }}
          MONDAY_SOURCE_COL:           ${{ secrets.MONDAY_SOURCE_COL }}
          MONDAY_DATE_COL:             ${{ secrets.MONDAY_DATE_COL }}
          TG_TOKEN:                    ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID:                  ${{ secrets.TG_CHAT_ID }}
        run: python scripts/daily_summary_cloud.py

      - name: Mark as sent
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo "sent" > .sent-marker
