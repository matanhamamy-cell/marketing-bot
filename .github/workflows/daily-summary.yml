name: Daily Summary

on:
  schedule:
    # ראשון–חמישי ב-20:00 שעון ישראל (קיץ = UTC+3) → 17:00 UTC
    # 5 כניסות בטווח 40 דק' — הראשון שיגיע שולח, השאר מוצאים ע"י cache
    - cron: '40 16 * * 0-4'
    - cron: '50 16 * * 0-4'
    - cron: '0 17 * * 0-4'
    - cron: '10 17 * * 0-4'
    - cron: '20 17 * * 0-4'
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set run date
        run: echo "RUN_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Check if already sent today
        id: cache
        uses: actions/cache@v4
        with:
          path: .sent-marker
          key: daily-${{ env.RUN_DATE }}

      - name: Checkout
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Daily Summary
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          MONDAY_API_TOKEN:            ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_BOARD_ID:             ${{ secrets.MONDAY_BOARD_ID }}
          MONDAY_TRANSACTIONS_BOARD_ID: ${{ secrets.MONDAY_TRANSACTIONS_BOARD_ID }}
          MONDAY_SOURCE_COL:           ${{ secrets.MONDAY_SOURCE_COL }}
          MONDAY_DATE_COL:             ${{ secrets.MONDAY_DATE_COL }}
          TG_TOKEN:                    ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID:                  ${{ secrets.TG_CHAT_ID }}
        run: python scripts/daily_summary_cloud.py

      - name: Mark as sent
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo "sent" > .sent-marker
