name: Daily Summary

concurrency:
  group: daily-summary
  cancel-in-progress: false

permissions:
  contents: write

on:
  schedule:
    # Cloudflare Worker שולח workflow_dispatch ב-17:00 UTC (20:00 ישראל) — הוא הטריגר הראשי
    # טריגר גיבוי: 18:00 UTC (21:00 ישראל) — רק אם ה-Worker נכשל
    - cron: '0 18 * * 0-4'
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if already sent today
        id: check
        run: |
          TODAY=$(date +%Y-%m-%d)
          if [ -f data/.daily-summary-sent ] && [ "$(cat data/.daily-summary-sent)" = "$TODAY" ]; then
            echo "already_sent=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_sent=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check.outputs.already_sent != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Daily Summary
        if: steps.check.outputs.already_sent != 'true'
        env:
          MONDAY_API_TOKEN:            ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_BOARD_ID:             ${{ secrets.MONDAY_BOARD_ID }}
          MONDAY_TRANSACTIONS_BOARD_ID: ${{ secrets.MONDAY_TRANSACTIONS_BOARD_ID }}
          MONDAY_SOURCE_COL:           ${{ secrets.MONDAY_SOURCE_COL }}
          MONDAY_DATE_COL:             ${{ secrets.MONDAY_DATE_COL }}
          TG_TOKEN:                    ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID:                  ${{ secrets.TG_CHAT_ID }}
        run: python scripts/daily_summary_cloud.py

      - name: Mark as sent
        if: steps.check.outputs.already_sent != 'true'
        run: |
          date +%Y-%m-%d > data/.daily-summary-sent
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/.daily-summary-sent
          git commit -m "Mark daily summary sent for $(date +%Y-%m-%d)"
          git pull --rebase -X ours origin main
          git push
