name: Good News System

on:
  schedule:
    # ימים 28-31, כל שעה 04:00-10:00 UTC (07:00-13:00 IST)
    # GitHub מאחר עד 4 שעות — כיסוי רחב מבטיח שלפחות אחד ירוץ ביום האחרון
    - cron: '0 4 28-31 * *'
    - cron: '0 5 28-31 * *'
    - cron: '0 6 28-31 * *'
    - cron: '0 7 28-31 * *'
    - cron: '0 8 28-31 * *'
    - cron: '0 9 28-31 * *'
    - cron: '0 10 28-31 * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'הרץ גם אם לא יום אחרון בחודש (לבדיקה)'
        required: false
        default: 'false'

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set month key
        id: month
        run: echo "key=$(date +%Y-%m)" >> $GITHUB_OUTPUT

      - name: Check if already sent this month
        id: cache
        uses: actions/cache@v4
        with:
          path: .good-news-marker
          key: good-news-${{ steps.month.outputs.key }}

      - name: Checkout
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Good News System
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          TG_TOKEN:         ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID:       ${{ secrets.TG_CHAT_ID }}
          FORCE_RUN:        ${{ github.event.inputs.force }}
        run: python scripts/good_news_system_cloud.py

      - name: Mark as sent
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo "sent" > .good-news-marker
