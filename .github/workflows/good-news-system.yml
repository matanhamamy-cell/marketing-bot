name: Good News System

on:
  schedule:
    # ימים 28-31 — הסקריפט בודק אם זה היום האחרון של החודש
    - cron: '0 6 28-31 * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'הרץ גם אם לא יום אחרון בחודש (לבדיקה)'
        required: false
        default: 'false'

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Good News System
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          TG_TOKEN:         ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID:       ${{ secrets.TG_CHAT_ID }}
          FORCE_RUN:        ${{ github.event.inputs.force }}
        run: python scripts/good_news_system_cloud.py
