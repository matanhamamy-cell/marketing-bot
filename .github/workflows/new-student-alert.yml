name: New Student Alert

concurrency:
  group: new-student-alert
  cancel-in-progress: false

permissions:
  contents: write

on:
  schedule:
    # every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: 'Look back N hours instead of using saved state (for testing)'
        required: false
        default: ''

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run alert script
        env:
          MONDAY_API_TOKEN:       ${{ secrets.MONDAY_API_TOKEN }}
          SCHOOLER_CLIENT_ID:     ${{ secrets.SCHOOLER_CLIENT_ID }}
          SCHOOLER_CLIENT_SECRET: ${{ secrets.SCHOOLER_CLIENT_SECRET }}
          SCHOOLER_USER_ID:       ${{ secrets.SCHOOLER_USER_ID }}
          SCHOOLER_USER_SECRET:   ${{ secrets.SCHOOLER_USER_SECRET }}
          TG_TOKEN:               ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID:             ${{ secrets.TG_CHAT_ID }}
          SALES_BOT_TOKEN:        ${{ secrets.SALES_BOT_TOKEN }}
          SALES_CHAT_ID:          ${{ secrets.SALES_CHAT_ID }}
          LOOKBACK_HOURS:         ${{ github.event.inputs.lookback_hours }}
        run: python scripts/new_student_alert.py

      - name: Commit updated state
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/.new-student-last-check)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/.new-student-last-check
            git commit -m "Update last-check state"
            git pull --rebase origin main
            git push
          fi
