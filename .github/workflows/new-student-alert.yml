name: New Student Alert

on:
  schedule:
    # every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: 'Look back N hours instead of using saved state (for testing)'
        required: false
        default: ''

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore last-check state
        uses: actions/cache@v5
        with:
          path: /tmp/last_student_check.txt
          key: new-student-state-${{ github.run_id }}
          restore-keys: |
            new-student-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run alert script
        env:
          MONDAY_API_TOKEN:       ${{ secrets.MONDAY_API_TOKEN }}
          SCHOOLER_CLIENT_ID:     ${{ secrets.SCHOOLER_CLIENT_ID }}
          SCHOOLER_CLIENT_SECRET: ${{ secrets.SCHOOLER_CLIENT_SECRET }}
          SCHOOLER_USER_ID:       ${{ secrets.SCHOOLER_USER_ID }}
          TG_TOKEN:               ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID:             ${{ secrets.TG_CHAT_ID }}
          LOOKBACK_HOURS:         ${{ github.event.inputs.lookback_hours }}
        run: python scripts/new_student_alert.py
