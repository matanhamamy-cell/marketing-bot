name: Monthly Summary

on:
  schedule:
    # 1 לכל חודש ב-09:00 שעון ישראל (קיץ = UTC+3) → 06:00 UTC
    - cron: '0 6 1 * *'
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Monthly Summary
        env:
          MONDAY_API_TOKEN:             ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_BOARD_ID:              ${{ secrets.MONDAY_BOARD_ID }}
          MONDAY_TRANSACTIONS_BOARD_ID: ${{ secrets.MONDAY_TRANSACTIONS_BOARD_ID }}
          MONDAY_SOURCE_COL:            ${{ secrets.MONDAY_SOURCE_COL }}
          MONDAY_DATE_COL:              ${{ secrets.MONDAY_DATE_COL }}
          META_ACCESS_TOKEN:            ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID:           ${{ secrets.META_AD_ACCOUNT_ID }}
          TG_TOKEN:                     ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID:                   ${{ secrets.TG_CHAT_ID }}
        run: python scripts/monthly_summary_cloud.py
