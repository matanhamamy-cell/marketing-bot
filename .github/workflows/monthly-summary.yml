name: Monthly Summary

concurrency:
  group: monthly-summary
  cancel-in-progress: false

permissions:
  contents: write

on:
  schedule:
    # Cloudflare Worker שולח workflow_dispatch ב-07:00 UTC (10:00 ישראל) ב-1 לחודש
    # טריגר גיבוי: 09:00 UTC (12:00 ישראל) ב-2 לחודש — רק אם ה-Worker נכשל
    - cron: '0 9 2 * *'
  workflow_dispatch:

jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if already sent this month
        id: check
        run: |
          THIS_MONTH=$(date +%Y-%m)
          if [ -f data/.monthly-summary-sent ] && [ "$(cat data/.monthly-summary-sent)" = "$THIS_MONTH" ]; then
            echo "already_sent=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_sent=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check.outputs.already_sent != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Monthly Summary
        if: steps.check.outputs.already_sent != 'true'
        env:
          MONDAY_API_TOKEN:             ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_BOARD_ID:              ${{ secrets.MONDAY_BOARD_ID }}
          MONDAY_TRANSACTIONS_BOARD_ID: ${{ secrets.MONDAY_TRANSACTIONS_BOARD_ID }}
          MONDAY_SOURCE_COL:            ${{ secrets.MONDAY_SOURCE_COL }}
          MONDAY_DATE_COL:              ${{ secrets.MONDAY_DATE_COL }}
          META_ACCESS_TOKEN:            ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID:           ${{ secrets.META_AD_ACCOUNT_ID }}
          TG_TOKEN:                     ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID:                   ${{ secrets.TG_CHAT_ID }}
        run: python scripts/monthly_summary_cloud.py

      - name: Mark as sent
        if: steps.check.outputs.already_sent != 'true'
        run: |
          date +%Y-%m > data/.monthly-summary-sent
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/.monthly-summary-sent
          git commit -m "Mark monthly summary sent for $(date +%Y-%m)"
          git pull --rebase origin main
          git push
