name: Cardcom Collection Sync

concurrency:
  group: cardcom-collection-sync
  cancel-in-progress: false

permissions:
  contents: write

on:
  schedule:
    # Sunday 07:00 Israel (summer time); second slot is a backup if GitHub skips the first —
    # the script exits early if it already ran today
    - cron: '0 4 * * 0'
    - cron: '0 6 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry = report only, live = write to Monday'
        required: false
        default: 'dry'
      force:
        description: 'Run even if it already ran today'
        required: false
        default: 'false'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run sync
        env:
          CARDCOM_API_NAME:     ${{ secrets.CARDCOM_API_NAME }}
          CARDCOM_API_PASSWORD: ${{ secrets.CARDCOM_API_PASSWORD }}
          MONDAY_API_TOKEN:     ${{ secrets.MONDAY_API_TOKEN }}
          TG_TOKEN:             ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID:           ${{ secrets.TG_CHAT_ID }}
          # scheduled runs stay in dry mode until Matan approves going live
          SYNC_MODE:            ${{ github.event.inputs.mode || 'dry' }}
          FORCE:                ${{ github.event.inputs.force || 'false' }}
        run: python scripts/cardcom_collection_sync.py

      - name: Commit run state
        if: always()
        run: |
          if [ -n "$(git status --porcelain data/.cardcom-sync-last-run)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/.cardcom-sync-last-run
            git commit -m "Update cardcom sync state"
            git pull --rebase -X ours origin main
            git push
          fi
