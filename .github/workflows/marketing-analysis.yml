name: Marketing Analysis

on:
  schedule:
    # ראשון ב-10:00 Israel time = 07:00 UTC (קיץ)
    # 5 כניסות בטווח 40 דק' — הראשון שיגיע שולח, השאר מוצאים ע"י cache
    - cron: '40 6 * * 0'
    - cron: '50 6 * * 0'
    - cron: '0 7 * * 0'
    - cron: '10 7 * * 0'
    - cron: '20 7 * * 0'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Set run date
        run: echo "RUN_DATE=$(date +%Y-%m-%d)" >> $GITHUB_ENV

      - name: Check if already sent today
        id: cache
        uses: actions/cache@v4
        with:
          path: .sent-marker
          key: marketing-${{ env.RUN_DATE }}

      - name: Checkout
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Marketing Analysis
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          META_ACCESS_TOKEN:   ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID:  ${{ secrets.META_AD_ACCOUNT_ID }}
          MONDAY_API_TOKEN:    ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_BOARD_ID:     ${{ secrets.MONDAY_BOARD_ID }}
          MONDAY_AD_SERIES_COL: ${{ secrets.MONDAY_AD_SERIES_COL }}
          MONDAY_AGE_COL:      ${{ secrets.MONDAY_AGE_COL }}
          MONDAY_SOURCE_COL:   ${{ secrets.MONDAY_SOURCE_COL }}
          MONDAY_DATE_COL:     ${{ secrets.MONDAY_DATE_COL }}
          TG_TOKEN:            ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID:          ${{ secrets.TG_CHAT_ID }}
        run: python scripts/marketing_analysis_cloud.py

      - name: Mark as sent
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo "sent" > .sent-marker
