name: Marketing Analysis

on:
  schedule:
    # ראשון ורביעי ב-08:00 Israel time = 06:00 UTC (קיץ)
    - cron: '0 6 * * 0'  # ראשון
    - cron: '0 6 * * 3'  # רביעי
  workflow_dispatch:      # הרצה ידנית מה-GitHub UI

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Marketing Analysis
        env:
          META_ACCESS_TOKEN:   ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID:  ${{ secrets.META_AD_ACCOUNT_ID }}
          MONDAY_API_TOKEN:    ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_BOARD_ID:     ${{ secrets.MONDAY_BOARD_ID }}
          MONDAY_AD_SERIES_COL: ${{ secrets.MONDAY_AD_SERIES_COL }}
          MONDAY_AGE_COL:      ${{ secrets.MONDAY_AGE_COL }}
          MONDAY_SOURCE_COL:   ${{ secrets.MONDAY_SOURCE_COL }}
          MONDAY_DATE_COL:     ${{ secrets.MONDAY_DATE_COL }}
          TG_TOKEN:            ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID:          ${{ secrets.TG_CHAT_ID }}
        run: python scripts/marketing_analysis_cloud.py
