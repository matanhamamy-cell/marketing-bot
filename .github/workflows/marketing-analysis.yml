name: Marketing Analysis

concurrency:
  group: marketing-analysis
  cancel-in-progress: false

permissions:
  contents: write

on:
  schedule:
    # Cloudflare Worker שולח workflow_dispatch ב-07:00 UTC (10:00 ישראל) — הוא הטריגר הראשי
    # טריגר גיבוי: 09:00 UTC (12:00 ישראל) — רק אם ה-Worker נכשל
    - cron: '0 9 * * 0'
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check if already sent today
        id: check
        run: |
          TODAY=$(date +%Y-%m-%d)
          if [ -f data/.marketing-analysis-sent ] && [ "$(cat data/.marketing-analysis-sent)" = "$TODAY" ]; then
            echo "already_sent=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_sent=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.check.outputs.already_sent != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Marketing Analysis
        if: steps.check.outputs.already_sent != 'true'
        env:
          META_ACCESS_TOKEN:   ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID:  ${{ secrets.META_AD_ACCOUNT_ID }}
          MONDAY_API_TOKEN:    ${{ secrets.MONDAY_API_TOKEN }}
          MONDAY_BOARD_ID:     ${{ secrets.MONDAY_BOARD_ID }}
          MONDAY_AD_SERIES_COL: ${{ secrets.MONDAY_AD_SERIES_COL }}
          MONDAY_AGE_COL:      ${{ secrets.MONDAY_AGE_COL }}
          MONDAY_SOURCE_COL:   ${{ secrets.MONDAY_SOURCE_COL }}
          MONDAY_DATE_COL:     ${{ secrets.MONDAY_DATE_COL }}
          TG_TOKEN:            ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID:          ${{ secrets.TG_CHAT_ID }}
        run: python scripts/marketing_analysis_cloud.py

      - name: Mark as sent
        if: steps.check.outputs.already_sent != 'true'
        run: |
          date +%Y-%m-%d > data/.marketing-analysis-sent
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/.marketing-analysis-sent
          git commit -m "Mark marketing analysis sent for $(date +%Y-%m-%d)"
          git pull --rebase -X ours origin main
          git push
