name: Contract Signed Alert

on:
  schedule:
    # every 5 minutes (unreliable on its own — external cron-job.org pings workflow_dispatch instead)
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      lookback_all:
        description: 'Scan entire mailbox instead of using saved state (for testing)'
        required: false
        default: ''

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore last-check state
        uses: actions/cache@v5
        with:
          path: /tmp/last_contract_uid.txt
          key: contract-signed-state-${{ github.run_id }}
          restore-keys: |
            contract-signed-state-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run alert script
        env:
          GMAIL_ADDRESS:     matanhamamy@gmail.com
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SALES_BOT_TOKEN:   ${{ secrets.SALES_BOT_TOKEN }}
          SALES_CHAT_ID:     ${{ secrets.SALES_CHAT_ID }}
          LOOKBACK_ALL:      ${{ github.event.inputs.lookback_all }}
        run: python scripts/contract_signed_alert.py
